name: ci
on:
  push:
  pull_request:
jobs:
  omniresearch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,pdf]"
      - run: pytest -q
  voicecore:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: voicecore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.*"
      - run: pip install -e ".[dev]" "ruff==0.16.*"
      - run: ruff check voicecore tests scripts
      - run: pytest -q
      - name: smoke the CLI end to end
        run: |
          voicecore demo --seconds 20 --codec-steps 30 --lm-steps 30 --root /tmp/vc
          voicecore status /tmp/vc > /dev/null
  voicecore-docker:
    runs-on: ubuntu-latest
    needs: voicecore
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t voicecore voicecore
      - name: container answers on /healthz and enforces the token
        run: |
          docker run -d --rm --name vc -e VOICECORE_TOKEN=ci-token-1234 -p 8765:8765 voicecore --init-preset tiny
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/healthz && break; sleep 2; done
          curl -sf http://127.0.0.1:8765/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/status)" = "401"
          curl -sf -H 'Authorization: Bearer ci-token-1234' http://127.0.0.1:8765/api/status > /dev/null
          docker stop vc
