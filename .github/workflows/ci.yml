name: ci
on:
  push:
  pull_request:
jobs:
  omniresearch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,pdf]"
      - run: pytest -q
  voicecore:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voicecore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -e ".[dev]" ruff
      - run: ruff check voicecore tests scripts
      - run: pytest -q
