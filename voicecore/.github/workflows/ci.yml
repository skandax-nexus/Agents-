name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -e ".[dev]" ruff
      - run: ruff check voicecore tests scripts
      - run: pytest -q
      - name: smoke the CLI end to end
        run: |
          voicecore demo --seconds 20 --codec-steps 30 --lm-steps 30 --root /tmp/vc
          voicecore status /tmp/vc > /dev/null
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t voicecore .
      - name: container answers on /healthz
        run: |
          docker run -d --rm --name vc -e VOICECORE_TOKEN=ci -e VOICECORE_PRESET=tiny -p 8765:8765 voicecore
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/healthz && break; sleep 2; done
          curl -sf http://127.0.0.1:8765/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/status)" = "401"
          curl -sf -H 'Authorization: Bearer ci' http://127.0.0.1:8765/api/status > /dev/null
          docker stop vc
